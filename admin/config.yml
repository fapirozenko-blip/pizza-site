backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "menu"
    label: "Меню (Блюда)"
    folder: "menu"
    format: "json"
    create: true
    fields:
      - { label: "Название блюда", name: "title", widget: "string" }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Цена", name: "price", widget: "string" }
      - { label: "Фото", name: "image", widget: "image", required: false }
